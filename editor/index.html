<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Data Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h2>Data Types</h2>
            <ul id="data-type-list">
                <li data-type="creatures">Creatures</li>
                <li data-type="dungeons">Dungeons</li>
                <li data-type="events">Events</li>
                <li data-type="equipment">Equipment</li>
                <li data-type="items">Items</li>
                <li data-type="party">Party</li>
                <li data-type="skills">Skills</li>
                <li data-type="passives">Passives</li>
                <li data-type="materials">Materials</li>
            </ul>
        </div>

        <div id="list-pane">
            <h2>Entries</h2>
            <div id="entry-list-controls">
                <button id="btn-new">New</button>
                <input type="text" id="search" placeholder="Search...">
            </div>
            <ul id="entry-list"></ul>
        </div>

        <div id="editor-pane">
            <div id="editor-header">
                <h2 id="editor-title">Select an entry</h2>
                <div id="editor-actions">
                    <button id="btn-save" disabled>Save</button>
                    <button id="btn-delete" disabled>Delete</button>
                    <button id="btn-export">Export All</button>
                </div>
            </div>
            <div id="editor-form"></div>
            <textarea id="raw-json" style="width: 100%; height: 300px; font-family: monospace; display: none;"></textarea>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
